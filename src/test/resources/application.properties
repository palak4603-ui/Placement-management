# TEST-ONLY settings. Save as src/test/resources/application.properties
# Tests use an in-memory database, so your real MySQL is never touched.

spring.datasource.url=jdbc:h2:mem:placementtest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Dummy passwords for the security config (used only in tests)
app.security.admin-password=test-admin-password
app.security.student-password=test-student-password